<!DOCTYPE HTML>
<html>
    <head>
        <style>
             *{
                box-sizing:border-box;
                font-family:Arial, Helvetica, sans-serif;
                color:rgb(0, 0, 0);
            }
            .container{
                width:100%;
                min-height:100vh;
                min-width: fit-content;
                background:#000000;
                display:flex;
                flex-direction:column;
                align-items:center;             
            }
            .card{
                width:300px;
                max-height: fit-content;
                background:#ffffff;
                border:3px solid #000;
                box-shadow:12px 12px 0 #8609d3;
                overflow:hidden;
                transform:translate(-6px,-6px);
                transition:.2s;

            }

                .card:hover{
                transform:translate(-10px,-10px);
                box-shadow:10px 10px 0 #012aa3;
            }

                .head{
                font-size:14px;
                font-weight:900;
                color:#ffffff;
                background:#000000;
                padding:5px 12px;
                border-bottom:3px solid #000;
            }

                .content{
                padding:8px 12px;
            }

                /* BUTTON */

                input[type ="submit"]{
                color:#ffffff;
                padding:5px 10px;
                border:3px solid #000;
                box-shadow:3px 3px 0 #000;
                background:#000000;
                cursor:pointer;
                transition:.15s;
            }

                input[type="submit"]:hover{
                transform:translate(2px,2px);
                box-shadow:1px 1px 0 #000;
                background:#69f04e;
            }

                .h1{
                color: #f74c9c;
                text-align: left;
                cursor: pointer;
            }

                .h1:hover{
                transform:translate(2px,2px);
                }
            #landing{
                opacity:0;
                transition:opacity 1.5s ease;
                width:100%;
                position:relative;
                z-index:1;
                }

                #landing.show{
                opacity:1;
                }

                #landing::before{
                content:"";
                position:absolute;
                inset:0;
                background-image:radial-gradient(circle at 1px 1px, rgb(255, 255, 255) 1px, transparent 0);
                background-size:25px 25px;
                animation:movePattern 40s linear infinite;
                z-index:-1;
                }

                @keyframes movePattern{
                from{background-position:0 0;}
                to{background-position:500px 500px;}
                }
                input{
                    color: #000000;
                }
 
        </style>
    </head>
        <body>
        <div class="container">
            <div id="landing" class="show">
                <div class="card">
                    <form action="sign.php" method="post">
                        <h1>SIGN UP</h1>
                        <label for="Username">Username:</label>
                        <input name = "Username" id="Username" type="text" required><br>
                        <label for="Password">Password</label>
                        <input name="Password" id="Password" type="password"><br>
                        <input type = "submit" value="SIGNUP" onclick="window.location.href='index.html';return false;">
                    </form>  
                    <h3>Already a user? <a href="login.html">Click here</a></h3>               
                </div>
            </div>    
        </div> 
     
        </body>    
</html>
